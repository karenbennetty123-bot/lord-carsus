
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lord Carsus İçin ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Segoe UI', sans-serif;
}

body{
background: linear-gradient(135deg, #1f1c2c, #928dab);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
overflow:hidden;
}

.container{
padding:20px;
max-width:500px;
animation: fadeIn 2s ease-in-out;
}

h1{
font-size:26px;
margin-bottom:15px;
}

p{
font-size:15px;
margin-bottom:20px;
line-height:1.6;
}

button{
background:white;
color:#1f1c2c;
border:none;
padding:12px 25px;
border-radius:30px;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#e0e0ff;
transform:scale(1.05);
}

#surprise{
display:none;
margin-top:20px;
animation: fadeIn 1s ease-in-out;
}

iframe{
margin-top:15px;
border-radius:12px;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

.heart{
position:absolute;
color:#ffffff;
animation: float 6s linear infinite;
font-size:20px;
opacity:0.7;
}

@keyframes float{
0%{transform:translateY(0) rotate(0);}
100%{transform:translateY(-100vh) rotate(360deg);}
}

@media (max-width:600px){
h1{font-size:22px;}
p{font-size:14px;}
}
</style>
</head>

<body>

<div class="container">
<h1>Lord Carsus 👑</h1>

<p>
25 Eylül 2025'ten beri kalbim aynı ritimde atıyor.  
Ve o ritim hep seninle anlam kazanıyor.
</p>

<button onclick="showSurprise()">Gerçek Mesajı Aç 💌</button>

<div id="surprise">
<p>
Sen sadece hayatıma giren biri değilsin...  
Sen hayatımı başka bir boyuta taşıyan kişisin.  
Gülüşün huzur, bakışın ev, sesin güven.  
Ve ben... seni her geçen gün daha çok seviyorum. ❤️
</p>

<h2 id="counter"></h2>

<!-- Spotify Embed -->
<iframe style="border-radius:12px" 
src="https://open.spotify.com/embed/track/5ghIJDpPoe3CfHMGu71E6T?utm_source=generator" 
width="100%" 
height="80" 
frameBorder="0" 
allowfullscreen="" 
allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
</iframe>

</div>
</div>

<script>
function showSurprise(){
document.getElementById("surprise").style.display="block";
}

const startDate = new Date("2025-09-25");
const counter = document.getElementById("counter");

setInterval(()=>{
let now = new Date();
let diff = now - startDate;

let days = Math.floor(diff / (1000*60*60*24));
if(days >= 0){
counter.innerHTML = days + " gündür birlikteyiz ❤️";
}else{
counter.innerHTML = "Henüz başlangıcımıza doğru sayıyoruz ⏳❤️";
}
},1000);

function createHeart(){
const heart = document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="❤";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=Math.random()*20+10+"px";
heart.style.animationDuration=Math.random()*3+3+"s";
document.body.appendChild(heart);

setTimeout(()=>{heart.remove();},6000);
}

setInterval(createHeart,500);
</script>

</body>
</html>
